name: expense-tracker

services:
  api:
    build: backend
    restart: always
    environment:
      # The SQL Server installed on this machine.
      ConnectionStrings__Default: Server=host.docker.internal,1433;Database=ExpenseTracker;User ID=expense_app;Password=${SQL_PASSWORD:?Set SQL_PASSWORD in .env};TrustServerCertificate=True
      Database__ApplyMigrationsOnStartup: "true"
      Claude__UseCli: "true"
      Auth__SecureCookie: "false"
      # Optional: leave these out of .env to keep the WhatsApp number switched off.
      WhatsApp__VerifyToken: ${WHATSAPP_VERIFY_TOKEN:-}
      WhatsApp__AppSecret: ${WHATSAPP_APP_SECRET:-}
      WhatsApp__AccessToken: ${WHATSAPP_ACCESS_TOKEN:-}
      WhatsApp__PhoneNumberId: ${WHATSAPP_PHONE_NUMBER_ID:-}
      # Superset charts on the Statistics page; the API signs in to Superset to issue viewer tokens.
      Superset__InternalUrl: http://superset:8088
      Superset__PublicUrl: http://172.30.0.51:8088
      Superset__Username: admin
      Superset__Password: ${SUPERSET_ADMIN_PASSWORD:?Set SUPERSET_ADMIN_PASSWORD in .env}
      Superset__DashboardId: ${SUPERSET_DASHBOARD_ID:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - claude-signin:/home/app/.claude

  web:
    build:
      context: frontend
      args:
        API_URL: http://api:8080
    restart: always
    depends_on:
      - api
    networks:
      default:
      # Reached like DDoc: through its tunnel, by this address, on devices with WARP on.
      ddoc:
        ipv4_address: 172.30.0.50

  superset:
    build: superset
    restart: always
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Set SUPERSET_SECRET_KEY in .env}
      SUPERSET_GUEST_TOKEN_SECRET: ${SUPERSET_GUEST_TOKEN_SECRET:?Set SUPERSET_GUEST_TOKEN_SECRET in .env}
      SUPERSET_ADMIN_USER: admin
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Set SUPERSET_ADMIN_PASSWORD in .env}
      EXPENSE_APP_ORIGIN: http://172.30.0.50:3000
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - superset-home:/app/superset_home
    networks:
      default:
      # Charts load straight from Superset in the browser, so it needs its own address on the WARP network.
      ddoc:
        ipv4_address: 172.30.0.51

networks:
  ddoc:
    external: true
    name: ddoc-hosted_ddoc-hosted

volumes:
  claude-signin:
  superset-home:
